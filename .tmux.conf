#Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'

# Theme plugin defaults are kept for plugin compatibility, then fully
# overridden after TPM loads by the yellow/black palette below.
set -g @catppuccin_flavour 'mocha' # latte,frappe, macchiato or mocha
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# Status bar - catppuccin modules config
set -g @catppuccin_status_modules_left ""
set -g @catppuccin_status_modules_right "session"

set-option -g automatic-rename off
set-option -g automatic-rename-format "#W"
set-option -g automatic-rename off
set-option -g status-right "#(cat /tmp/claude-status 2>/dev/null) #S"

#Configs
set -g prefix C-space
bind C-space send-prefix

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
bind | split-window -h -b  -c "#{pane_current_path}" # Split panes horizontal
bind - split-window -v -b  -c "#{pane_current_path}" # Split panes vertically

# Pane resizing
bind [ resize-pane -L 5
bind ] resize-pane -R 5

# Show the deer system banner only when a tmux session is created.
# It opens as a right-side overlay, so it does not consume prompt/scrollback.
# New windows/splits do not trigger this hook.
set-hook -g session-created 'run-shell "sleep 0.35; /opt/homebrew/bin/tmux display-popup -E -B -x R -y C -w 72% -h 16 -t \"#{hook_session_name}:1.1\" \"/Users/nvidela/.local/bin/tmux-startup-banner; sleep 4\""'

run '~/.tmux/plugins/tpm/tpm'

# Trail-cam yellow/black theme. Mirrors Ghostty:
# background #050403, foreground #f1d98a, bright yellow #ffd25a.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#050403,fg=#f1d98a"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[bg=#ffd25a,fg=#050403,bold] #S #[bg=#050403,fg=#4a3812] "
set -g status-right "#[fg=#8a6a21]#(cat /tmp/claude-status 2>/dev/null) #[fg=#ffd25a,bold]%H:%M #[fg=#4a3812]│ #[fg=#f1d98a]#D "

set -g window-status-separator ""
set -g window-status-format "#[bg=#050403,fg=#8a6a21] #I:#W "
set -g window-status-current-format "#[bg=#4a3812,fg=#fff1b8,bold] #I:#W "
set -g window-status-style "bg=#050403,fg=#8a6a21"
set -g window-status-current-style "bg=#4a3812,fg=#fff1b8,bold"
set -g window-status-activity-style "bg=#050403,fg=#ffd25a,bold"
set -g window-status-bell-style "bg=#d6a62f,fg=#050403,bold"

set -g pane-border-style "fg=#352b16"
set -g pane-active-border-style "fg=#ffd25a"
set -g pane-border-lines single
set -g display-panes-colour "#8a6a21"
set -g display-panes-active-colour "#ffd25a"

set -g message-style "bg=#4a3812,fg=#fff1b8,bold"
set -g message-command-style "bg=#050403,fg=#ffd25a,bold"
set -g mode-style "bg=#d6a62f,fg=#050403,bold"
set -g clock-mode-colour "#ffd25a"
set -g copy-mode-match-style "bg=#4a3812,fg=#fff1b8"
set -g copy-mode-current-match-style "bg=#ffd25a,fg=#050403,bold"
